name: Google Scholar stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stats from Google Scholar
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || '1aegp6sAAAAJ' }}
        run: |
          pip install -r requirements.txt
          python main.py

      - name: Publish results to the google-scholar-stats branch
        working-directory: google_scholar_crawler/results
        run: |
          git init -b google-scholar-stats
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add ./*.json
          git commit -m "Update Google Scholar stats"
          git push --force \
            "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:google-scholar-stats
